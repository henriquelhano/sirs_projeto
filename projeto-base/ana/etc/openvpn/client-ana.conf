client
dev tun
proto udp

remote 6.6.6.1 1194

ca   /etc/openvpn/ca.crt
cert /etc/openvpn/ana.crt
key  /etc/openvpn/ana.key
tls-auth /etc/openvpn/ta.key 1
remote-cert-tls server

cipher AES-128-GCM
ncp-ciphers AES-128-GCM

route-nopull
route 3.2.4.0 255.255.255.0

resolv-retry infinite
nobind
persist-key
persist-tun

verb 3